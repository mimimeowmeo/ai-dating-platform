# 內部測試用的輕量版：砍掉 ai / ai-worker（未接真模型，測試用不到），只跑 6 個服務。
# 啟動：docker compose -f docker-compose.test.yml up -d --build --wait
# 停止：docker compose -f docker-compose.test.yml down
# 注意：用 -f 指定本檔時，compose 不會自動疊加 docker-compose.override.yml，所以這裡自包含 heartlink-pg / heartlink-minio。
# 完整版（含 AI）仍用原本的：docker compose up -d

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  heartlink-pg:
    image: pgvector/pgvector:pg16
    container_name: heartlink-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: heartlink
      POSTGRES_PASSWORD: heartlink
      POSTGRES_DB: heartlink
    ports: ["5433:5432"]
    volumes:
      - heartlink_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartlink -d dating"]
      interval: 5s
      timeout: 5s
      retries: 15

  heartlink-minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: heartlink-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: heartlink
      MINIO_ROOT_PASSWORD: heartlink123
    ports: ["9002:9000", "9003:9001"]
    volumes:
      - heartlink_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://heartlink:heartlink@heartlink-pg:5432/dating?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://heartlink-minio:9000
      S3_ACCESS_KEY: heartlink
      S3_SECRET_KEY: heartlink123
      S3_BUCKET: heartlink-media
      JWT_SECRET: ${JWT_SECRET:?請執行 pnpm setup}
      # 用服務名連 AI，跟主要的 docker-compose.yml 一樣。這份檔案本身沒有 ai 服務：
      # - 單獨啟動時連不到 ai，AI 推薦回 503 固定代碼，其他功能照常（同 CI）。
      # - 跟主要 stack 一起跑、只用這份檔案重建 api 時（例如開對外 tunnel 前重設 WEB_ORIGIN），
      #   會連到主要 stack 正在跑的 ai 容器。以前寫 localhost:8000，在容器裡指的是 api 自己，
      #   AI 推薦因此一律回 503（AI_UNREACHABLE）。
      AI_INTERNAL_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?請執行 pnpm setup}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:3001:3001"]
    # ★ 關鍵：移除了對 ai 的 depends_on，否則 api 會一直等一個不存在的服務而起不來。
    depends_on:
      redis: { condition: service_healthy }
      heartlink-pg: { condition: service_healthy }
      heartlink-minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 15

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    volumes:
      ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  # 沿用既有的 heartlink 資料卷（含現有測試資料與 CelebA 圖），external=不新建、直接接上舊資料。
  heartlink_pg_data:
    external: true
    name: heartlink-sandbox_heartlink_pg_data
  heartlink_minio_data:
    external: true
    name: heartlink-sandbox_heartlink_minio_data
