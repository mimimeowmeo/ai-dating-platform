# 內部測試用的輕量版：砍掉 ai / ai-worker（未接真模型，測試用不到），只跑 6 個服務。
# 啟動：docker compose -f docker-compose.test.yml up -d --build --wait
# 停止：docker compose -f docker-compose.test.yml down
# 注意：用 -f 指定本檔時，compose 不會自動疊加 docker-compose.override.yml，所以這裡自包含 heartlink-pg / heartlink-s3。
# 完整版（含 AI）仍用原本的：docker compose up -d

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  heartlink-pg:
    image: pgvector/pgvector:pg16
    container_name: heartlink-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: heartlink
      POSTGRES_PASSWORD: heartlink
      POSTGRES_DB: heartlink
    ports: ["5433:5432"]
    volumes:
      - heartlink_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartlink -d dating"]
      interval: 5s
      timeout: 5s
      retries: 15

  # 物件儲存（圖床）：SeaweedFS，取代已撤下公開映像的 MinIO（見 docs/architecture/adr/0001-local-mvp-boundaries.md）。
  # 資料在 external volume heartlink-s3-data（1 萬張示範圖＋使用者上傳的照片）；新機器要先 docker volume create 再還原照片。
  heartlink-s3:
    image: chrislusf/seaweedfs:4.47
    container_name: heartlink-s3
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: heartlink
      AWS_SECRET_ACCESS_KEY: heartlink123
    # 主機端沿用 MinIO 時代的 9002（S3）與 9003（管理介面），.env 的 S3_ENDPOINT 不用改。
    # 只綁 127.0.0.1：SeaweedFS 的管理介面預設不用登入。
    ports: ["127.0.0.1:9002:8333", "127.0.0.1:9003:23646"]
    volumes:
      - heartlink_s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://heartlink:heartlink@heartlink-pg:5432/dating?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://heartlink-s3:8333
      S3_ACCESS_KEY: heartlink
      S3_SECRET_KEY: heartlink123
      S3_BUCKET: heartlink-media
      JWT_SECRET: ${JWT_SECRET:?請執行 pnpm setup}
      # 用服務名連 AI，跟主要的 docker-compose.yml 一樣。這份檔案本身沒有 ai 服務：
      # - 單獨啟動時連不到 ai，AI 推薦回 503 固定代碼，其他功能照常（同 CI）。
      # - 跟主要 stack 一起跑、只用這份檔案重建 api 時（例如開對外 tunnel 前重設 WEB_ORIGIN），
      #   會連到主要 stack 正在跑的 ai 容器。以前寫 localhost:8000，在容器裡指的是 api 自己，
      #   AI 推薦因此一律回 503（AI_UNREACHABLE）。
      AI_INTERNAL_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?請執行 pnpm setup}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:3001:3001"]
    # ★ 關鍵：移除了對 ai 的 depends_on，否則 api 會一直等一個不存在的服務而起不來。
    depends_on:
      redis: { condition: service_healthy }
      heartlink-pg: { condition: service_healthy }
      heartlink-s3: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 15

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 採信哪個來源 IP（影響登入／註冊限流），見 infrastructure/nginx/client-ip/。
      # 值打錯時直接啟動失敗，不會默默建出空目錄。
      - type: bind
        source: ./infrastructure/nginx/client-ip/${NGINX_CLIENT_IP:-direct}.conf
        target: /etc/nginx/conf.d/client-ip.conf
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  # 沿用既有的 heartlink 資料卷（含現有測試資料與 CelebA 圖），external=不新建、直接接上舊資料，
  # 也不會被 down -v 刪掉。
  heartlink_pg_data:
    external: true
    name: heartlink-sandbox_heartlink_pg_data
  heartlink_s3_data:
    external: true
    name: heartlink-s3-data
