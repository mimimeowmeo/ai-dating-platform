# CI 專用：完全從零啟動，所有連線設定都吃 pnpm setup 產生的 .env，
# 所以容器內與主機端（integration.test.mjs 用 PrismaClient 直連）看到的是同一組帳密與埠。
#
# 為什麼不用主 docker-compose.yml：它的資料庫與物件儲存定義在 docker-compose.override.yml，
# 那個檔案不進版控，CI 上拿不到，api 會因為連不上資料庫而 unhealthy。
#
# 不含 ai / ai-worker（服務已移除，見 docker-compose.yml 的說明）。
# 啟動：docker compose -f docker-compose.ci.yml up -d --build --wait

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?請執行 pnpm setup}
      POSTGRES_USER: ${POSTGRES_USER:?請執行 pnpm setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請執行 pnpm setup}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?請執行 pnpm setup}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?請執行 pnpm setup}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DOCKER_DATABASE_URL:?請執行 pnpm setup}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-dating-media}
      JWT_SECRET: ${JWT_SECRET:?請執行 pnpm setup}
      # ai 服務已移除；這裡只是讓啟動時的 env 驗證過關，實際不會連線。
      AI_INTERNAL_URL: http://127.0.0.1:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 15
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 採信哪個來源 IP（影響登入／註冊限流），見 infrastructure/nginx/client-ip/。
      # 值打錯時直接啟動失敗，不會默默建出空目錄。
      - type: bind
        source: ./infrastructure/nginx/client-ip/${NGINX_CLIENT_IP:-direct}.conf
        target: /etc/nginx/conf.d/client-ip.conf
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
  minio_data:
