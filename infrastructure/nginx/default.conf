map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_tokens off;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # 主機名直接寫在 proxy_pass 裡，nginx 只在啟動時查一次 IP，api／web 重建換 IP 後就一直連舊位址（502）。
  # 改用變數，請求時才向 Docker 內建 DNS 查，valid 把快取從 Docker 給的 600 秒縮成 10 秒。
  # 變數只含「協定://主機:埠」、不帶路徑，轉給上游的請求路徑跟寫死時一樣是原樣轉送；
  # 預設的 proxy_redirect 遇到變數會停用，各 location 另外寫回原本的預設值。
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3001;
  set $web_upstream http://web:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_redirect http://api:3001/ /;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_redirect http://api:3001/ /;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_read_timeout 75s;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_redirect http://web:3000/ /;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
