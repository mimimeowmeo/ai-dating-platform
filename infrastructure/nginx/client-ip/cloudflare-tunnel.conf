# cloudflared 跑在同一台主機、經 127.0.0.1 的埠轉發連進 nginx，nginx 看到的來源是 Docker 網路閘道。
# 只有來自本機／Docker 私有網段的連線，才用 CF-Connecting-IP 取代來源位址。
# nginx 的埠若能繞過 cloudflared 直接連到，連線者就能偽造這個標頭，這種部署不要啟用。
set_real_ip_from 127.0.0.0/8;
set_real_ip_from ::1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
