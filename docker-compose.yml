services:
  # 📘 舊的 dating-postgres 已於切換到 Heartlink PG 後移除；新 DB(heartlink-pg)定義在 docker-compose.override.yml。
  # 📘 舊的 tools-adminer(:8081)一併移除，改用 heartlink-adminer(:8090，自動登入)。備份在 backups/dating-postgres-backup.sql。
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  # 📘 舊的 minio(dating-media)已移除；圖床改用 heartlink-minio(定義在 docker-compose.override.yml，bucket heartlink-media)。
  # AI 服務（ai / ai-worker）已移除：真人驗證尚未接上實際模型，留著只是空轉。
  # 移除後 POST /onboarding/selfie 會走既有的降級路徑，回 status=unavailable、
  # reasonCode=AI_SERVICE_UNAVAILABLE（見 apps/api/src/profiles.ts 的 verifySelfie）。
  # 原始碼保留在 services/ai/，要恢復就把這段服務定義加回來。
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DOCKER_DATABASE_URL:?請執行 pnpm setup}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://heartlink-minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-heartlink-media}
      JWT_SECRET: ${JWT_SECRET:?請執行 pnpm setup}
      # ai 服務已移除，這個位址一定連不上，verifySelfie 會走降級路徑。
      AI_INTERNAL_URL: ${AI_INTERNAL_URL:-http://127.0.0.1:8000}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 15
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    volumes:
      ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  redis_data:
