services:
  # 📘 舊的 dating-postgres 已於切換到 Heartlink PG 後移除；新 DB(heartlink-pg)定義在 docker-compose.override.yml。
  # 📘 舊的 tools-adminer(:8081)一併移除，改用 heartlink-adminer(:8090，自動登入)。備份在 backups/dating-postgres-backup.sql。
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  # 📘 舊的 minio(dating-media)已移除；圖床改用 heartlink-minio(定義在 docker-compose.override.yml，bucket heartlink-media)。
  # AI 服務：2026-09-23 為了「AI 推薦回覆」重新加回來（docs/ai/REPLY-SUGGESTIONS-SPEC.md）。
  # ai 提供同步的 /internal/ai/* 給 NestJS 呼叫；ai-worker 消費 ai-jobs、把結果放進 ai-results。
  # 真人驗證仍然沒有接上辨識模型，POST /onboarding/selfie 會回 unavailable / MODEL_NOT_CONFIGURED。
  # 沒有設定模型金鑰時，推薦與向量化會回 503 固定代碼，不會假造結果。
  ai:
    build: { context: ., dockerfile: services/ai/Dockerfile }
    restart: unless-stopped
    environment: &ai-env
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?請執行 pnpm setup}
      REDIS_URL: redis://redis:6379
      # 真人驗證的 provider（目前未選定，留空即維持 unavailable）。
      AI_VERIFICATION_PROVIDER_URL: ${AI_VERIFICATION_PROVIDER_URL:-}
      AI_VERIFICATION_PROVIDER_TOKEN: ${AI_VERIFICATION_PROVIDER_TOKEN:-}
      # AI 推薦回覆：預設 Ollama Cloud 為主、Gemini 備援，向量一律用 gemini-embedding-2。
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AI_REPLY_MODELS: ${AI_REPLY_MODELS:-ollama:gemma4:31b,gemini-3.8-flash}
      AI_REPLY_MODEL_TIMEOUT_SECONDS: ${AI_REPLY_MODEL_TIMEOUT_SECONDS:-12}
      AI_REPLY_THINKING_LEVEL: ${AI_REPLY_THINKING_LEVEL:-LOW}
      AI_EXTRACTION_MODELS: ${AI_EXTRACTION_MODELS:-ollama:gemma4:31b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-gemini-embedding-2}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-768}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
  ai-worker:
    build: { context: ., dockerfile: services/ai/Dockerfile }
    restart: unless-stopped
    stop_grace_period: 30s
    # 背景萃取的 worker（切片、話題區段、摘要、風格卡）；真人驗證的 worker 未啟用。
    command: ["python", "-m", "app.reply.worker"]
    environment: *ai-env
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "app.reply.worker_health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DOCKER_DATABASE_URL:?請執行 pnpm setup}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://heartlink-minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-heartlink-media}
      JWT_SECRET: ${JWT_SECRET:?請執行 pnpm setup}
      # 固定用服務名連線（同 S3_ENDPOINT 的做法）：.env 裡的 AI_INTERNAL_URL 是給
      # 本機 pnpm dev 用的 127.0.0.1，帶進容器會連到容器自己而失敗。
      # ai 沒起來時 AI 功能回 503 固定代碼，其他功能照常。
      AI_INTERNAL_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      redis: { condition: service_healthy }
      # 只等「已啟動」而不是「健康」：ai 沒有金鑰或模型暫時壞掉時，
      # 其他功能仍要能用，AI 推薦則回 503 固定代碼。
      ai: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 15
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    volumes:
      ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  redis_data:
