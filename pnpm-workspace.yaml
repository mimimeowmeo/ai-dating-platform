packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

storeDir: .pnpm-store

# 鎖定安全修補版本，避免 NestJS / Prisma 的間接依賴仍使用已公告弱點版本。
overrides:
  multer: "2.4.0"
  deepmerge-ts: "8.0.0"
  sharp: "0.35.4"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
